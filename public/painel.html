<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GetVisa - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; /* Alterado para empilhar o painel e o formulário */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            margin-bottom: 20px; /* Espaço entre o painel e o formulário */
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .data-item {
            background-color: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .emoji {
            font-size: 2em;
            margin-top: 20px;
        }
        /* Estilos para o formulário */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            margin-top: 20px; /* Espaço entre o painel e o formulário */
            text-align: left;
        }
        .form-container h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
        }
        .form-group button:hover {
            background-color: #218838;
        }
        .form-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel Administrativo GetVisa</h1>
        <p>Carregando dados do servidor...</p>
        <div id="dashboard-data">
            <!-- Os dados do backend serão inseridos aqui -->
        </div>
        <div class="emoji">📊</div>
    </div>

    <!-- Formulário de Contato -->
    <div class="form-container">
        <h2>Enviar Mensagem de Contato</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <div class="form-group">
                <button type="submit">Enviar Mensagem</button>
            </div>
        </form>
        <div id="formMessage" class="form-message"></div>
    </div>
    <!-- O SCRIPT JAVASCRIPT ENTRA AQUI, ANTES DO FECHAMENTO DO </body> -->
</body>
</html>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const dashboardDataElement = document.getElementById('dashboard-data');

        // Código para buscar dados do dashboard
        if (dashboardDataElement) {
            fetch('/api/dashboard-data')
                .then(data => {
                    dashboardDataElement.innerHTML = `
                        <div class="data-item">
                            Total de clientes: ${data.totalClientes ?? 0}
                        </div>

                        <div class="data-item">
                            Novos clientes hoje: ${data.novosHoje ?? 0}
                        </div>

                        <div class="data-item">
                            Onboarding completos: ${data.onboardingCompletos ?? 0}
                        </div>

                        <h3>Clientes cadastrados</h3>

                        ${
                            data.clientes && data.clientes.length > 0
                                ? `
                                    <div class="table-wrapper">
                                        <table class="clients-table">
                                            <thead>
                                                <tr>
                                                    <th>Nome</th>
                                                    <th>Telefone</th>
                                                    <th>Status</th>
                                                    <th>Etapa</th>
                                                    <th>Último contato</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${data.clientes.map(cliente => `
                                                    <tr>
                                                        <td>${cliente.nome || 'Não informado'}</td>
                                                        <td>${cliente.telefone || 'Não informado'}</td>
                                                        <td>${cliente.status || 'Sem status'}</td>
                                                        <td>${cliente.etapa_atual || 'Não definida'}</td>
                                                        <td>
                                                            ${
                                                                cliente.data_atualizacao
                                                                    ? new Date(
                                                                        cliente.data_atualizacao
                                                                      ).toLocaleString('pt-BR')
                                                                    : 'Não informado'
                                                            }
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                `
                                : '<p class="data-item">Nenhum cliente cadastrado.</p>'
                        }

                        <p class="data-item">
                            Última atualização:
                            ${new Date().toLocaleString('pt-BR')}
                        </p>
                    `;
                })
                .catch(error => {(error => {
                    console.error('Erro ao buscar dados do dashboard:', error);
                    dashboardDataElement.innerHTML = `<p style="color: red;">Erro ao carregar dados: ${error.message}</p>`;
                });
        } else {
            console.error("Erro: Elemento com ID 'dashboard-data' não encontrado no HTML.");
        }

        // Lógica para enviar o formulário
        const contactForm = document.getElementById('contactForm');
        const formMessage = document.getElementById('formMessage');

        if (contactForm) {
            contactForm.addEventListener('submit', async (event) => {
                event.preventDefault(); // Previne o comportamento padrão de recarregar a página

                const formData = new FormData(contactForm);
                const data = Object.fromEntries(formData.entries()); // Converte FormData para um objeto JS

                try {
                    const response = await fetch('http://localhost:10000/api/contact-form', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data) // Envia os dados como JSON
                    });

                    const result = await response.json();

                    if (response.ok) {
                        formMessage.className = 'form-message success';
                        formMessage.textContent = result.message;
                        contactForm.reset(); // Limpa o formulário
                    } else {
                        formMessage.className = 'form-message error';
                        formMessage.textContent = result.message || 'Erro ao enviar formulário.';
                    }
                } catch (error) {
                    console.error('Erro ao enviar formulário:', error);
                    formMessage.className = 'form-message error';
                    formMessage.textContent = 'Erro de conexão ou servidor.';
                }
            });
        }
    });
</script>
