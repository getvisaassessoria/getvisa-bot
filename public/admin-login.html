cat > public/admin-login.html << 'EOF'
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - GetVisa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #005599 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            color: #003366;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #003366;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #005599;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🇺🇸</div>
        <h1>GetVisa Admin</h1>
        <p class="subtitle">Digite sua chave de acesso</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="apiKey">🔑 Chave de Acesso (API Key)</label>
                <input type="password" id="apiKey" placeholder="Digite sua chave" required autofocus>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
            <div id="errorMessage" class="error-message">❌ Chave inválida. Tente novamente.</div>
        </form>

        <div class="footer">
            <p>GetVisa Assessoria - Sistema de Administração</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            if (!apiKey) {
                errorMsg.textContent = '❌ Por favor, digite a chave de acesso.';
                errorMsg.style.display = 'block';
                return;
            }

            localStorage.setItem('admin_api_key', apiKey);
            window.location.href = `/admin.html?api_key=${encodeURIComponent(apiKey)}`;
        });

        const savedKey = localStorage.getItem('admin_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    </script>
</body>
</html>
EOF
