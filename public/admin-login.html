<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - GetVisa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003366, #1a5276);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            color: #003366;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .login-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-box label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .login-box input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        .login-box input[type="password"]:focus {
            border-color: #003366;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-box button:hover {
            background: #1a5276;
        }
        .login-box button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .login-box .error {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
        }
        .login-box .hint {
            text-align: center;
            margin-top: 15px;
            color: #999;
            font-size: 12px;
        }
        .login-box .hint strong {
            color: #666;
        }
        .login-box .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #003366;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 GetVisa Admin</h1>
        <p class="subtitle">Digite sua chave de acesso</p>
        
        <form id="loginForm">
            <label for="apiKey">Chave de Acesso (API Key)</label>
            <input type="password" id="apiKey" placeholder="Digite sua chave de acesso" required autofocus>
            
            <button type="submit" id="btnLogin">Entrar</button>
        </form>
        
        <div id="error" class="error">Chave de acesso inválida. Tente novamente.</div>
        <div id="loading" class="loading">⏳ Verificando...</div>
        <div class="hint">🔒 Chave padrão: <strong>admin123</strong></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const apiKeyInput = document.getElementById('apiKey');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const btnLogin = document.getElementById('btnLogin');

            // Verifica se já está logado
            const chaveExistente = sessionStorage.getItem('adminKey');
            if (chaveExistente) {
                // Se já tem chave, redireciona direto
                window.location.href = '/?api_key=' + encodeURIComponent(chaveExistente);
                return;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const apiKey = apiKeyInput.value.trim();
                
                // Limpa erro anterior
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
                
                if (!apiKey) {
                    errorDiv.textContent = 'Por favor, digite a chave de acesso.';
                    errorDiv.style.display = 'block';
                    apiKeyInput.focus();
                    return;
                }
                
                // Mostra loading
                loadingDiv.style.display = 'block';
                btnLogin.disabled = true;
                btnLogin.textContent = 'Verificando...';
                
                try {
                    console.log('📨 Enviando requisição para /api/admin/login');
                    console.log('🔑 Chave:', apiKey);
                    
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ apiKey })
                    });
                    
                    console.log('📨 Status:', response.status);
                    
                    const data = await response.json();
                    console.log('📨 Resposta:', data);
                    
                    if (data.success) {
                        // 🔥 SALVA A CHAVE NO SESSION STORAGE
                        sessionStorage.setItem('adminKey', apiKey);
                        console.log('✅ Chave salva no sessionStorage');
                        
                        // Redireciona para o dashboard com a chave
                        window.location.href = '/?api_key=' + encodeURIComponent(apiKey);
                    } else {
                        errorDiv.textContent = data.message || 'Chave de acesso inválida.';
                        errorDiv.style.display = 'block';
                        apiKeyInput.value = '';
                        apiKeyInput.focus();
                    }
                } catch (error) {
                    console.error('❌ Erro:', error);
                    errorDiv.textContent = 'Erro ao conectar ao servidor. Verifique sua internet.';
                    errorDiv.style.display = 'block';
                } finally {
                    loadingDiv.style.display = 'none';
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                }
            });

            // Permite Enter no campo de senha
            apiKeyInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
