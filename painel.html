<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GetVisa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f0f2f5;
            color: #333;
        }

        header {
            background: #007bff;
            color: #fff;
            padding: 24px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        main {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        .status {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 6px;
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h2 {
            margin: 0 0 10px;
            color: #555;
            font-size: 1rem;
        }

        .card strong {
            display: block;
            color: #007bff;
            font-size: 2rem;
        }

        .panel {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .panel h2 {
            margin-top: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
        }

        th {
            background: #007bff;
            color: #fff;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 700px) {
            .summary {
                grid-template-columns: 1fr;
            }

            main {
                width: 92%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Painel GetVisa</h1>
        <p>Acompanhamento dos clientes e processos</p>
    </header>

    <main>
        <div id="status" class="status">
            Carregando dados do servidor...
        </div>

        <section class="summary">
            <div class="card">
                <h2>Total de clientes</h2>
                <strong id="total-clientes">0</strong>
            </div>

            <div class="card">
                <h2>Novos hoje</h2>
                <strong id="novos-hoje">0</strong>
            </div>

            <div class="card">
                <h2>Onboarding completos</h2>
                <strong id="onboarding-completos">0</strong>
            </div>
        </section>

        <section class="panel">
            <h2>Clientes cadastrados</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Status</th>
                            <th>Etapa atual</th>
                            <th>Último contato</th>
                        </tr>
                    </thead>

                    <tbody id="clientes-tabela">
                        <tr>
                            <td colspan="5" class="empty">
                                Carregando clientes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        function escaparHtml(valor) {
            return String(valor ?? '')
                .replaceAll('&', '&')
                .replaceAll('<', '<')
                .replaceAll('>', '>')
                .replaceAll('"', '"')
                .replaceAll("'", ''');
        }

        function formatarData(data) {
            if (!data) {
                return 'Não informado';
            }

            const dataFormatada = new Date(data);

            if (Number.isNaN(dataFormatada.getTime())) {
                return 'Data inválida';
            }

            return dataFormatada.toLocaleString('pt-BR');
        }

        async function carregarDashboard() {
            const status = document.getElementById('status');
            const tabela = document.getElementById('clientes-tabela');

            try {
                const resposta = await fetch('/api/dashboard-data');

                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}`);
                }

                const dados = await resposta.json();

                document.getElementById('total-clientes').textContent =
                    dados.totalClientes ?? 0;

                document.getElementById('novos-hoje').textContent =
                    dados.novosHoje ?? 0;

                document.getElementById('onboarding-completos').textContent =
                    dados.onboardingCompletos ?? 0;

                const clientes = dados.clientes || [];

                if (clientes.length === 0) {
                    tabela.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                    `;
                } else {
                    tabela.innerHTML = clientes.map(cliente => `
                        <tr>
                            <td>${escaparHtml(cliente.nome || 'Não informado')}</td>
                            <td>${escaparHtml(cliente.telefone || 'Não informado')}</td>
                            <td>${escaparHtml(cliente.status || 'Sem status')}</td>
                            <td>${escaparHtml(cliente.etapa_atual || 'Não definida')}</td>
                            <td>${escaparHtml(formatarData(cliente.data_atualizacao))}</td>
                        </tr>
                    `).join('');
                }

                status.textContent =
                    `Servidor online. Dados atualizados em ${new Date().toLocaleString('pt-BR')}.`;

                status.className = 'status success';
            } catch (erro) {
                console.error('Erro ao carregar o dashboard:', erro);

                status.textContent =
                    `Erro ao carregar dados: ${erro.message}`;

                status.className = 'status error';

                tabela.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            Não foi possível carregar os clientes.
                        </td>
                    </tr>
                `;
            }
        }

        document.addEventListener(
            'DOMContentLoaded',
            carregarDashboard
        );
    </script>
</body>
</html>
